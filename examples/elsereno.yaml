# Lab configuration. Only scanner.max_concurrent_targets differs from
# the default (10 instead of 100, gentle on a laptop lab); the other
# keys carry their default values to show where each one goes.
# Print every key with: elsereno config show
scanner:
    max_concurrent_targets: 10
    max_concurrent_per_host: 1
log:
    level: info
web:
    rate_limit_per_min_ip: 100
    rate_limit_per_min_token: 300
